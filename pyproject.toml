[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firstlight"
version = "0.2.0"
description = "FirstLight — the 6 AM on-call agent for the air a child breathes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Srijan Jaiswal" }]
keywords = ["air-quality", "aqi", "cpcb", "grap", "schools", "aws", "serverless", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8", "pytest-cov>=5", "coverage>=7"]
aws = ["aws-lambda-powertools>=2.40"]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-cov>=5",
    "coverage>=7",
    "ruff>=0.6",
    "mypy>=1.10",
    "cfn-lint>=1.0",
]

[project.urls]
Homepage = "https://github.com/ionfwsrijan/FirstLight"
Repository = "https://github.com/ionfwsrijan/FirstLight"
Issues = "https://github.com/ionfwsrijan/FirstLight/issues"

[tool.setuptools.packages.find]
include = ["firstlight*"]

# ---------------------------------------------------------------------------
# Lint (ruff) — the collection gate. `ruff check` must be clean.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".aws-sam",
    "sam/build-layer",
    "sam/.aws-sam",
    "data",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length handled by the formatter, not the linter
    "B008",  # FastAPI Depends()/Query() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"sam/static/index.py" = ["E501"]
"tests/*" = ["E402"]  # tests insert the repo root on sys.path before imports

# ---------------------------------------------------------------------------
# Types (mypy) — the type gate.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["firstlight"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
warn_unused_configs = true

# ---------------------------------------------------------------------------
# Tests (pytest / unittest) and coverage floor.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["firstlight"]
branch = true
omit = ["firstlight/api/server.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
