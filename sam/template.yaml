# FirstLight — Ship It (AWS SAM) mirror of the local Build It app.
#
# The local product (FastAPI + SQLite) is the demoable build. This SAM
# application is the deployable twin: the exact same decision engine and
# rule DSL run inside Lambda, with the same data written to DynamoDB and the
# same capability model enforced by AWS-native auth (Cognito + scoped IAM).
# Authorization logic mirrors firstlight/auth/cedar/policies.cedar.
#
# Least privilege: every function gets an inline policy scoped to the single
# table (read vs read/write) or the single Cognito pool action it needs — no
# broad AWS-managed policies, so the IAM grants match the app's one-directional
# role model instead of contradicting it.

AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  FirstLight Ship It track — 6 AM school-air agent. Decision engine is
  deterministic (CPCB bands, GRAP stages, stubble-plume model, custom rule
  DSL): pure Python shared with the local build via a Lambda layer.

Parameters:
  Env:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  AlertHookUrl:
    Type: String
    Default: ""
    Description: Optional Slack/Teams webhook for alert delivery.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Architectures: [arm64]
    Tracing: Active
    Environment:
      Variables:
        TABLE_NAME: !Ref DecisionsTable
        ENV: !Ref Env
        RULESET_VERSION: firstlight-rules-v2@2026-10
        ALERT_HOOK_URL: !Ref AlertHookUrl
        LOG_LEVEL: INFO
    Layers:
      - !Ref FirstLightCoreLayer

Resources:
  # ---- Data (mirror of the local decisions/alerts/history tables) ----
  DecisionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub firstlight-${Env}-data
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  # ---- Auth: Cognito mirrors the parent/principal/officer roles ----
  FirstLightUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub firstlight-${Env}-pool
      AutoVerifiedAttributes: [email]
      # Admin-only provisioning: no self-signup; roles are assigned by ops.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireUppercase: true
          RequireNumbers: true
  FirstLightUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref FirstLightUserPool
      ClientName: firstlight-console
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH, ALLOW_ADMIN_USER_PASSWORD_AUTH]
      # Short-lived console sessions; the gateway authorizer trusts this id token.
      IdTokenValidity: 60
      AccessTokenValidity: 60
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes

  # ---- The core decision layer (pure Python, shared with local build) ----
  FirstLightCoreLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub firstlight-core-${Env}
      Description: firstlight package (engine, dsl, ledger, agent). Built by build_layer.py.
      ContentUri: build-layer
      CompatibleRuntimes: [python3.12]

  # ---- Scoped IAM policy documents (least privilege, no managed policies) ----
  # Read-only functions: status + the console data surface.
  # Read/write functions: morning run + talk (writes decisions, alerts, ledger,
  # transcript). Both are scoped to this one table and its indexes.
  # Public login: only the two Cognito auth flows it calls, on this one pool.

  # ---- Lambdas (mirror of the local API) ----
  MorningHandler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: handlers/
      Handler: morning.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !GetAtt DecisionsTable.Arn
                - !Sub ${DecisionsTable.Arn}/index/*
        - Statement:
            - Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
              Resource: "*"
      Events:
        Api:
          Type: Api
          Properties:
            Path: /morning
            Method: POST
            RestApiId: !Ref FirstLightApi
            Auth:
              Authorizer: FirstLightAuthorizer

  SchoolStatusHandler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: handlers/
      Handler: morning.status_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !GetAtt DecisionsTable.Arn
                - !Sub ${DecisionsTable.Arn}/index/*
        - Statement:
            - Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
              Resource: "*"
      Events:
        Api:
          Type: Api
          Properties:
            Path: /status
            Method: GET
            RestApiId: !Ref FirstLightApi
            Auth:
              Authorizer: FirstLightAuthorizer

  TalkHandler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: handlers/
      Handler: talk.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !GetAtt DecisionsTable.Arn
                - !Sub ${DecisionsTable.Arn}/index/*
        - Statement:
            - Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
              Resource: "*"
      Events:
        Api:
          Type: Api
          Properties:
            Path: /talk
            Method: POST
            RestApiId: !Ref FirstLightApi
            Auth:
              Authorizer: FirstLightAuthorizer

  # ---- Console data endpoints (mirror of the local /api/* surface) ----
  MetaHandler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: handlers/
      Handler: meta.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource:
                - !GetAtt DecisionsTable.Arn
                - !Sub ${DecisionsTable.Arn}/index/*
        - Statement:
            - Effect: Allow
              Action:
                - xray:PutTraceSegments
                - xray:PutTelemetryRecords
              Resource: "*"
      Events:
        Health:
          Type: Api
          Properties:
            Path: /health
            Method: GET
            RestApiId: !Ref FirstLightApi
            Auth:
              Authorizer: NONE
        Inputs:
          Type: Api
          Properties:
            Path: /inputs
            Method: GET
            RestApiId: !Ref FirstLightApi
        Schools:
          Type: Api
          Properties:
            Path: /schools
            Method: GET
            RestApiId: !Ref FirstLightApi
        Decisions:
          Type: Api
          Properties:
            Path: /decisions/{schoolId}
            Method: GET
            RestApiId: !Ref FirstLightApi
        Transcript:
          Type: Api
          Properties:
            Path: /transcript
            Method: GET
            RestApiId: !Ref FirstLightApi
        Ledger:
          Type: Api
          Properties:
            Path: /ledger
            Method: GET
            RestApiId: !Ref FirstLightApi
        LedgerVerify:
          Type: Api
          Properties:
            Path: /ledger/verify
            Method: GET
            RestApiId: !Ref FirstLightApi
        Outbox:
          Type: Api
          Properties:
            Path: /outbox
            Method: GET
            RestApiId: !Ref FirstLightApi
        RefreshFires:
          Type: Api
          Properties:
            Path: /sources/refresh
            Method: POST
            RestApiId: !Ref FirstLightApi

  # ---- The browser console (public static page, Cognito-backed login) ----
  UiHandler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: static/
      Handler: index.handler
      Timeout: 10
      MemorySize: 128
      Policies: [AWSLambdaBasicExecutionRole]
      Events:
        Root:
          Type: Api
          Properties:
            Path: /
            Method: GET
            RestApiId: !Ref FirstLightApi
            Auth:
              Authorizer: NONE

  # ---- Public login: issues a Cognito token for the console like the local one ----
  LoginHandler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: handlers/
      Handler: login.handler
      Timeout: 10
      MemorySize: 128
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminInitiateAuth
                - cognito-idp:InitiateAuth
              Resource: !GetAtt FirstLightUserPool.Arn
      Environment:
        Variables:
          USER_POOL_ID: !Ref FirstLightUserPool
          USER_POOL_CLIENT_ID: !Ref FirstLightUserPoolClient
      Events:
        Api:
          Type: Api
          Properties:
            Path: /login
            Method: POST
            RestApiId: !Ref FirstLightApi
            Auth:
              Authorizer: NONE

  FirstLightApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Env
      TracingEnabled: true
      Auth:
        DefaultAuthorizer: FirstLightAuthorizer
        Authorizers:
          FirstLightAuthorizer:
            UserPoolArn: !GetAtt FirstLightUserPool.Arn

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL.
    Value: !Sub https://${FirstLightApi}.execute-api.${AWS::Region}.amazonaws.com/${Env}/
  UserPoolId:
    Description: Cognito user pool id for role assignment.
    Value: !Ref FirstLightUserPool
  UserPoolClientId:
    Description: Cognito client id for the console.
    Value: !Ref FirstLightUserPoolClient
  TableName:
    Description: DynamoDB table backing the twin.
    Value: !Ref DecisionsTable
